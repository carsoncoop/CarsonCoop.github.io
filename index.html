<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name</title>
<meta name="description" content="Music, audio, and code by Your Name.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9e8f2;
    --ink: #1c1b2e;
    --muted: #55536b;
    --accent: #3b3bf2;
    --line: #c9c7e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15142a;
      --ink: #ecebfa;
      --muted: #a3a1c4;
      --accent: #8c8cff;
      --line: #2e2c52;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 12vh 24px 64px;
  }
  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(3rem, 12vw, 5.5rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin: 0 0 20px;
  }
  .bio {
    font-size: 1.125rem;
    color: var(--muted);
    max-width: 44ch;
    margin: 0 0 40px;
  }
  .wave {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 48px;
    margin-bottom: 32px;
  }
  .wave span {
    flex: 1;
    background: var(--accent);
    border-radius: 2px;
    height: var(--h);
    transform-origin: center;
    animation: grow 0.7s ease-out backwards;
    animation-delay: calc(var(--i) * 18ms);
  }
  @keyframes grow { from { transform: scaleY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .wave span { animation: none; }
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 0; }
  a.link {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 20px 4px;
    border-top: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 500;
    font-size: 1.5rem;
  }
  li:last-child a.link { border-bottom: 1px solid var(--line); }
  a.link small {
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
  }
  a.link:hover, a.link:focus-visible { color: var(--accent); }
  a.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Your Name</h1>
  <p class="bio">I make music, work with audio, and write code. Everything I'm working on lives at the links below.</p>

  <!-- Decorative waveform. Heights are percentages; edit freely. -->
  <div class="wave" aria-hidden="true" id="wave"></div>

  <ul>
    <!-- Replace each href with your real link, and edit the labels. -->
    <li><a class="link" href="https://yourname.bandcamp.com"><span>Music</span><small>Bandcamp</small></a></li>
    <li><a class="link" href="https://soundcloud.com/yourname"><span>Audio</span><small>SoundCloud</small></a></li>
    <li><a class="link" href="https://github.com/yourusername"><span>Code</span><small>GitHub</small></a></li>
    <li><a class="link" href="https://www.linkedin.com/in/yourname"><span>Work</span><small>LinkedIn</small></a></li>
  </ul>
</main>
<script>
  // Builds the waveform bars (smooth pseudo-random shape).
  var wave = document.getElementById('wave');
  var n = 48;
  for (var i = 0; i < n; i++) {
    var s = document.createElement('span');
    var h = 18 + 70 * Math.abs(Math.sin(i * 0.5) * Math.cos(i * 0.17 + 1)) + (i * 7 % 11);
    s.style.setProperty('--h', Math.min(100, h) + '%');
    s.style.setProperty('--i', i);
    wave.appendChild(s);
  }
</script>
</body>
</html>
